name: CungKienReminders
options:
  bundleIdPrefix: vn.cungkien
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  CungKienReminders:
    type: application
    platform: iOS
    sources:
      - path: CungKienReminders
      - path: Shared
    configFiles:
      Debug: Config.xcconfig
      Release: Config.xcconfig
    info:
      properties:
        CFBundleDisplayName: Cúng Kiến
        SUPABASE_URL: $(SUPABASE_URL)
        SUPABASE_ANON_KEY: $(SUPABASE_ANON_KEY)
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - cungkien
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: vn.cungkien.reminders
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: CungKienReminders/CungKienReminders.entitlements
    dependencies:
      - target: CungKienWidgetExtension
        embed: true
  CungKienWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: CungKienWidgetExtension
      - path: Shared
    info:
      properties:
        CFBundleDisplayName: Nhắc lịch Cúng Kiến
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: vn.cungkien.reminders.widget
        GENERATE_INFOPLIST_FILE: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGN_ENTITLEMENTS: CungKienWidgetExtension/CungKienWidgetExtension.entitlements
